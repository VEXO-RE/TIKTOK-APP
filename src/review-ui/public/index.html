<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>ShopinistaMeta — TikTok Sandbox Review</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    section { border: 1px solid #ddd; border-radius: .75rem; padding: 1rem; margin: 1rem 0; }
    button, .button { display: inline-block; padding: .65rem 1rem; border: 0; border-radius: .4rem; background: #111; color: #fff; text-decoration: none; cursor: pointer; }
    .notice { background: #fff7d6; padding: .75rem; }
    output { display: block; white-space: pre-wrap; margin-top: .75rem; }
  </style>
</head>

<body>
  <main>
    <h1>TikTok Sandbox Review</h1>
    <section>
      <h2>1. Connect TikTok</h2>
      <a class="button" href="/auth/tiktok" target="tiktok-connect">Connect TikTok</a>
      <p id="connection">Checking connection…</p>
    </section>
    <section>
      <h2>2. Upload draft</h2>
      <form id="upload-form">
        <input name="video" type="file" accept="video/mp4,video/quicktime,video/webm" required>
        <button type="submit">Upload draft to TikTok</button>
      </form>
      <output id="upload-result" aria-live="polite"></output>
    </section>
    <section>
      <h2>3. Check status</h2>
      <form id="status-form">
        <input id="publish-id" name="publishId" placeholder="publish_id" required>
        <button type="submit">Check status</button>
      </form>
      <output id="status-result" aria-live="polite"></output>
    </section>
    <p class="notice">After upload, open TikTok Inbox to continue editing and publish.</p>
  </main>
  <script>
    const connection = document.querySelector("#connection");
    const uploadResult = document.querySelector("#upload-result");
    const statusResult = document.querySelector("#status-result");
    const publishId = document.querySelector("#publish-id");

    async function refreshConnection() {
      const response = await fetch("/api/tiktok/content/connection");
      const body = await response.json();
      connection.textContent = body.connected
        ? "Connected to TikTok for this server session."
        : "Not connected. Complete TikTok Login first.";
    }

    document.querySelector("#upload-form").addEventListener("submit", async event => {
      event.preventDefault();
      uploadResult.textContent = "Uploading…";
      const response = await fetch("/api/tiktok/content/upload", {
        method: "POST",
        body: new FormData(event.currentTarget)
      });
      const body = await response.json();
      if (!response.ok) {
        uploadResult.textContent = body.error?.message || "Upload failed.";
        return;
      }
      publishId.value = body.publishId;
      uploadResult.textContent = `publish_id: ${body.publishId}\n${body.nextStep}`;
    });

    document.querySelector("#status-form").addEventListener("submit", async event => {
      event.preventDefault();
      statusResult.textContent = "Checking…";
      const response = await fetch("/api/tiktok/content/status", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ publishId: publishId.value })
      });
      const body = await response.json();
      statusResult.textContent = response.ok
        ? JSON.stringify(body, null, 2)
        : body.error?.message || "Status request failed.";
    });

    window.addEventListener("focus", refreshConnection);
    refreshConnection();
  </script>
</body>
</html>
